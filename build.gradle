plugins {
    id 'groovy'
    id 'io.github.ben-manes.versions' version '0.63.0'
    id 'org.nosphere.apache.rat' version '0.11.0'
}

version = '0.1'
group = 'groovy.blog'
//def groovyVersion = '5.0.0-alpha-12'
//def groovyVersion = '5.0.0-beta-1'
def groovyVersion = '6.0.0-RC-3'

repositories {
    mavenLocal { content { includeGroup 'org.apache.groovy' } }
    maven { url = 'https://repository.apache.org/content/repositories/orgapachegroovy-1123' } // RC-3 staging
    mavenCentral()
    maven{url = 'https://repository.apache.org/content/repositories/snapshots/' }
}

def jdkVersion = providers.gradleProperty('jdkVersion').getOrElse('25')

// Groovy 6 needs JDK 17, but some examples need a newer one; each is compiled and run only
// where its APIs exist, so the same build works across the CI matrix.
def jdk = jdkVersion as int
def jdkFloor = { String name ->
    if (name.startsWith('Gatherers4j')) return 25      // gatherers4j 0.14.0 declares a JVM 25 floor
    if (name.endsWith('Gatherer')) return 24           // java.util.stream.Gatherer is final in JDK 24
    if (name == 'IteratorExamples') return 21          // list.first / *.last are SequencedCollection getters
    17
}
def runnable = { String name -> jdk >= jdkFloor(name) }

dependencies {
    implementation "org.apache.groovy:groovy:$groovyVersion"
    implementation "org.apache.groovy:groovy-macro:$groovyVersion"
    implementation "org.apache.groovy:groovy-ginq:$groovyVersion"
    implementation "org.apache.groovy:groovy-nio:$groovyVersion"
    if (runnable('Gatherers4jExamples')) {
        implementation 'com.ginsberg:gatherers4j:0.14.0'
    }
    implementation('com.bloidonia:groovy-stream:0.9.1') {
        exclude group: 'org.codehaus.groovy' // built against Groovy 2.3; Groovy 6 supplies the runtime
    }
}


def runall = tasks.register('runAll') {
    group = 'Application'
}

FileUtil.baseNames(sourceSets.main.allSource.files).each { name ->
    def subtask = tasks.register("run$name", JavaExec) {
        dependsOn compileGroovy
        group = 'Application'
        description = "Run ${name}.groovy as a JVM application/Groovy script"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = name
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jdkVersion)
        }
    }
    if (runnable(name)) {
        runall.configure {
            dependsOn subtask
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(jdkVersion)
    }
}

sourceSets {
    main {
        groovy {
            exclude { element ->
                def name = element.file.name
                name.endsWith('.groovy') && !runnable(name - '.groovy')
            }
        }
    }
}

tasks.named('rat') {
    excludes = ['**/build/**', '.idea', 'gradle/wrapper', '**/.gradle']
}

// native-build.sh: the runtime jars beside the compiled scripts
tasks.register('copyDependenciesToLib', Sync) {
    into layout.buildDirectory.dir('lib')
    from configurations.runtimeClasspath
}
